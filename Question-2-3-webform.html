<!DOCTYPE html>
<html lang="en">
    <head>
      <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
      <meta charset="utf-8">
      <style>
        .control, fieldset {
          margin: 6px 0;
        }
        
        label {
          display: inline-block;
          width: 120px;
          vertical-align: top;
        }
        
        input + label {
          width: auto;
        }
        
        .error, .required {
          color: red;
        }
        
        fieldset ul {
          margin: 0;
        }
      </style>
    </head>
    <body>
        <h1>Feedback form</h1>
    <form>
      <!-- Explain required fields before the form -->
      <p>Fields marked “required” must be completed.</p>

      <div class="control">
        <!-- Associate full name label to input field using 'for' attribute, assigning a value similar to the full name input id, and mark as required -->
        <label for="name">Full name (required)</label>
        <input id="name" name="name" type="text" />
      </div>

      <div class="control">
        <!-- Associate biography label to input field using for attribute, assigning a value similar to the biography input id -->
        <label for="biography">Biography (required)</label>
        <!-- Add aria describedby to connect the biography textarea to extra information -->
        <textarea id="biography" name="biography" aria-describedby="biography-info"></textarea>
        <span id="biography-info">Include examples on your skills in JavaScript.</span>
      </div>
      
      <!-- Group gender inputs, 'male' and 'female' using 'fieldset' since they belong to the same group 'gender'  -->
      <fieldset>
        <!-- Add legend to give a title to the fieldset -->
        <legend>Gender (required)</legend>

        <div class="control">
          <label>
            <input id="gender_male" name="gender" type="radio" value="male" />
            Male
          </label>
        </div>

        <div class="control">
          <label>
            <input id="gender_female" name="gender" type="radio" value="female" />
            Female
          </label>
        </div>
      </fieldset>
      
      <div class="control">
        <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" />
        <label for="accept_agbs">I accept the terms and conditions (required)</label>
      </div>
      
      <div class="control">
        <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
      </div>
      </form>
      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>"use strict";
      
      ;
      (function () {
        var validateInput;
      
        $.urlParam = function (name) {
          var results;
          results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      
          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };
      
        validateInput = function validateInput(input, message) {
          var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
          $input = $('[name="' + input + '"]');
      
          if ((value = $.urlParam(input)) === null) {
            if ($('fieldset.errors').length === 0) {
              // add role='alert' to ensure error notification is accessible to keyboard and screen reader users
              // add tabindex = "-1" to ensure that the focus moves to the errors area
              $('form').prepend('<fieldset class="errors" tabindex="-1" role="alert"><legend>Errors</legend><ul></ul></fieldset>');
            }
      
            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $('fieldset.errors ul');
      
            if ($input.is(':radio')) {
              $fieldset = $input.closest('fieldset');
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(':first');
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
      // R.G. hint: fix next line ;)
      // add href to link the error message to the input field that has an error
            $error = $('<a href="#' + $referencedElement.attr('id') + '">' + message + '</a>');
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
              $referencedElement.focus();
              return e.preventDefault();
            });
            $elementToDescribe.attr('aria-describedby', input + '_description');
            $errorContainer.append('<li>').find('li:last').append($error);
      
            if ($(':not(form):focus').length === 0) {
              // add $('fieldset.errors').focus() to ensure that the keyboard focus moves to the errors area
              $('fieldset.errors').focus();
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
            
            }
          } else {
            if ($input.is(':checkbox')) {
              $input.attr('checked', true);
            }
      
            if ($input.is(':radio')) {
              return $input.filter('[value="' + value + '"]').attr('checked', true);
            } else {
              return $input.val(value);
            }
          }
        };
      
        $(document).ready(function () {
          if ($.urlParam('validate')) {
            validateInput('name', 'Please enter your name!');
            validateInput('biography', 'Please tell us something about your history!');
            validateInput('gender', 'Please tell us your gender!');
            validateInput('accept_agbs', 'You must accept our terms and conditions!');
      
            // Replace ".error" with "fieldset.errors" to search for class errors in the specific fieldset for validation
            if ($('fieldset.errors').length === 0) {
              return alert('All inputs are valid.');
            }
          }
        });
      }).call(void 0);</script>
                
        </body>
      </html>
